[project]
name = "pi-screen"
version = "0.1.0"
description = "OctoPrint status dashboard for the MS912x USB LCD"
requires-python = ">=3.11"
dependencies = [
    "pillow==9.4.0",
    "requests==2.28.1",
    "websocket-client==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
